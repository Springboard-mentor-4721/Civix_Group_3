<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Civix | Digital Civix Engagement Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts: Exo 2 (Default), Caveat, Cormorant Upright, Playpen Sans, Roboto Slab, Vollkorn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cormorant+Upright:wght@400;600;700&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Playpen+Sans:wght@100..800&family=Roboto+Slab:wght@100..900&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('civix_citizen_settings');
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed.font_family) {
            document.documentElement.style.fontFamily = parsed.font_family;
          }
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
