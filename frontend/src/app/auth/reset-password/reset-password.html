<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🏛</div>
      <h1>Civix</h1>
      <p>Create a new password</p>
    </div>

    <div *ngIf="tokenMissing" class="error-box">
      <p>⚠ Invalid or missing reset link. Please request a new one.</p>
      <a routerLink="/forgot-password" class="link-btn">Request New Link</a>
    </div>

    <div *ngIf="!tokenMissing && !submitted">
      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label>New Password</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required />
        </div>

        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required />
        </div>

        <p class="error" *ngIf="errorMessage">⚠ {{ errorMessage }}</p>

        <button type="submit" [disabled]="loading">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    </div>

    <div class="success-box" *ngIf="submitted">
      <div class="success-icon">✅</div>
      <p>Your password has been reset successfully. Redirecting to login...</p>
    </div>
  </div>
</div>
