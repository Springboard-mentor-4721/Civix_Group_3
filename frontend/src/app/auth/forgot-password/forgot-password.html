<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🏛</div>
      <h1>Civix</h1>
      <p>Reset your password</p>
    </div>

    <div *ngIf="!submitted">
      <p class="instructions">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="your@email.com" required />
        </div>

        <p class="error" *ngIf="errorMessage">⚠ {{ errorMessage }}</p>

        <button type="submit" [disabled]="loading">
          {{ loading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    </div>

    <div class="success-box" *ngIf="submitted">
      <div class="success-icon">✅</div>
      <p>{{ message }}</p>
    </div>

    <p class="switch-text">Remember your password? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
